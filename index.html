        <h1>Zurio: Webdesign und Webentwicklung für Schweizer Firmen</h1>
        <p>Zurio ist ein Webstudio aus Winterthur im Kanton Zürich. Wir entwerfen und programmieren Webseiten für Schweizer KMU, zum verbindlichen Fixpreis und in ein bis zwei Wochen ab Auftrag. Vom ersten Gespräch bis zum Launch sprechen Sie mit den zwei Leuten, die Ihre Seite bauen: Noah Kreier und Leon Helg, beide ausgebildete Applikationsentwickler EFZ.</p>

        <h2>Was Zurio anbietet</h2>
        <ul>
          <li><strong>Webdesign:</strong> individuelles Design, kein Template von der Stange.</li>
          <li><strong>Webentwicklung:</strong> von Hand programmiert, schnelle Ladezeiten, saubere Technik.</li>
          <li><strong>Texte:</strong> Copywriting als Modul, wenn Inhalte fehlen.</li>
          <li><strong>SEO-Grundlagen und E-Commerce</strong> als zubuchbare Module.</li>
        </ul>

        <h2>Für wen Zurio geeignet ist</h2>
        <p>Für kleine und mittlere Unternehmen in der Schweiz: Dienstleister, Handwerksbetriebe, Praxen, Eventveranstalter, lokale Marken und Shops. Die meisten Projekte liegen zwischen CHF 1'000 und CHF 5'000, die Spanne über alle Module reicht von CHF 700 bis CHF 8'000.</p>

        <h2>Referenzprojekte</h2>
        <ul>
          <li><strong>InspireDay</strong>, Eventveranstalter in Zürich: über 1'000 verkaufte Tickets über fünf Events seit dem Relaunch. <a href="https://zurio.ch/referenzen/inspireday">Zur Case Study</a></li>
          <li><strong>Hikebeast</strong>, eigenes Produkt von Zurio: Web-App mit über 140 Schweizer Wander- und Wildcamping-Spots, über CHF 60'000 Umsatz in sechs Monaten.</li>
          <li><strong>Andrea Buralli</strong>, Trauerbegleitung in Zürich: ruhiges, einfühlsames Design, in Umsetzung.</li>
          <li><strong>Driven Co.</strong>, Schweizer Streetwear: über 400 verkaufte Einheiten in zwei Drops.</li>
        </ul>

        <h2>So läuft ein Projekt ab</h2>
        <ol>
          <li>Erstgespräch, 30 Minuten, kostenlos und unverbindlich.</li>
          <li>Festofferte und Konzept innert zwei bis drei Tagen, mit Fixpreis und Liefertermin.</li>
          <li>Design und Umsetzung in ein bis zwei Wochen.</li>
          <li>Launch und Betreuung, 30 Tage Anpassungen inklusive, Hosting und Domain im ersten Jahr inbegriffen.</li>
        </ol>
